<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>Vite + Preact</title>
		<script>
			(() => {
					var raw = localStorage.getItem("math_scrabble_prefs");
					var prefs = raw ? JSON.parse(raw) : {};
					var theme = prefs && (prefs.theme === "light" || prefs.theme === "dark" ? prefs.theme : "system");
					var locale = prefs && prefs.locale === "ko" ? "ko" : "en";
					var resolved;
				try {
					resolved =
						theme === "system"
							? window.matchMedia?.("(prefers-color-scheme: dark)").matches
								? "dark"
								: "light"
							: theme;
					document.documentElement.dataset.theme = resolved;
					document.documentElement.lang = locale;
					document.documentElement.style.colorScheme = resolved;
					document.title = locale === "ko" ? "수학 크로스워드" : "Math Crossword";
				} catch {}
			})();
		</script>
	</head>
	<body>
		<div id="app"></div>
		<template id="game-skeleton">
			<!-- Injected at build time by calculate:inject-skeleton -->
		</template>
		<script>
			// biome-ignore lint/complexity/useArrowFunction: This inline fallback runs before legacy bundles.
			(function () {
				var url = new URL(window.location.href);
				var match = url.pathname.match(/(?:^|\/)game\/(easy|medium|hard)\/?$/);
				var stage = url.searchParams.get("stage");
				var app = document.getElementById("app");
				var template = document.getElementById("game-skeleton");
				var clone;
				var titleElem;
				var progressBar;
				var currentProgress = 0;
				var interval;

				if (!match || !stage || !app || !template) return;

				var isKorean = document.documentElement.lang === "ko";
				var difficultyLabels = isKorean
					? { easy: "쉬움", medium: "보통", hard: "어려움" }
					: { easy: "Easy", medium: "Medium", hard: "Hard" };
				var difficultyText = difficultyLabels[match[1]] || match[1].charAt(0).toUpperCase() + match[1].slice(1);
				var loadingText = isKorean ? "퍼즐 생성 중..." : "Generating Puzzle...";
				var buttonLabels = isKorean
					? {
							back: "뒤로",
							previous: "이전 단계",
							next: "다음 단계",
							reset: "단계 초기화",
						}
					: {
							back: "Back",
							previous: "Previous Stage",
							next: "Next Stage",
							reset: "Reset Stage",
						};

				clone = template.content.cloneNode(true);
				titleElem = clone.getElementById("skeleton-title");

				if (titleElem) {
					titleElem.textContent =
						document.documentElement.lang === "ko"
							? `${difficultyText} — ${stage}단계`
							: `${difficultyText} — Stage ${stage}`;
				}

				clone
					.querySelectorAll("[data-skeleton-button]")
					.forEach((button) => {
						var key = button.dataset.skeletonButton;
						if (!key) return;
						if (buttonLabels[key]) {
							button.setAttribute("aria-label", buttonLabels[key]);
						}
					});
				var loadingTextNode;
				if (document.documentElement.lang === "ko") {
					loadingTextNode = clone.querySelector("[data-skeleton-loading-text]");
					if (loadingTextNode) {
						loadingTextNode.textContent = loadingText;
					}
				}

				// If app already has content (like the main menu from a SPA fallback), clear it
				// unless it looks like it's already a skeleton or prerendered game UI.
				if (app.children.length > 0 && !app.querySelector(".route-progress-bar")) {
					app.innerHTML = "";
				}

				// Only append if app is now empty
				if (app.children.length === 0) {
					progressBar = clone
						.getElementById("skeleton-progress")
						?.querySelector(".route-progress-bar");

					if (progressBar) {
						/* __PROGRESS_LOGIC_PLACEHOLDER__ */
						interval = setInterval(() => {
							if (currentProgress < 88) {
								currentProgress = getNextTrickleProgress(currentProgress);
								progressBar.style.width = `${currentProgress}%`;
								window.__INITIAL_PROGRESS__ = currentProgress;
							}
						}, 100);
						window.__PROGRESS_INTERVAL__ = interval;
					}

					app.appendChild(clone);
				}
			})();
		</script>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
